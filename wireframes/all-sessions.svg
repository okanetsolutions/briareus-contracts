<text x="350" y="1000" xml:space="preserve" style="white-space:pre" font-family="monospace" font-size="20" fill="#303030"><tspan x="350" dy="20">Behavior and platform notes</tspan></text>
<text x="350" y="1046" xml:space="preserve" style="white-space:pre" font-family="monospace" font-size="14" fill="#303030"><tspan x="350" dy="14">Select All above the projects to open the combined session list shown above.</tspan></text>
<text x="350" y="1075" xml:space="preserve" style="white-space:pre" font-family="monospace" font-size="14" fill="#303030"><tspan x="350" dy="14">Each row names its project; status/PR glyph, provider, branch and age follow the existing list.</tspan></text>
<text x="350" y="1104" xml:space="preserve" style="white-space:pre" font-family="monospace" font-size="14" fill="#303030"><tspan x="350" dy="14">Only sessions accessible to the current token on the connected server are included.</tspan></text>
<text x="350" y="1133" xml:space="preserve" style="white-space:pre" font-family="monospace" font-size="14" fill="#303030"><tspan x="350" dy="14">Opening a session uses its real project. Back preserves All and its scroll position.</tspan></text>
<text x="350" y="1162" xml:space="preserve" style="white-space:pre" font-family="monospace" font-size="14" fill="#303030"><tspan x="350" dy="14">All has no project tabs. New session requires a real project in the existing picker.</tspan></text>
<text x="350" y="1191" xml:space="preserve" style="white-space:pre" font-family="monospace" font-size="14" fill="#303030"><tspan x="350" dy="14">Windows/Mac: sidebar beside conversation; iPhone/narrow iPad: projects &gt; All &gt; conversation.</tspan></text>
<text x="350" y="1220" xml:space="preserve" style="white-space:pre" font-family="monospace" font-size="14" fill="#303030"><tspan x="350" dy="14">Quest: separate list/conversation panels, headset.type sizing and existing worker nesting.</tspan></text>
<text x="350" y="1249" xml:space="preserve" style="white-space:pre" font-family="monospace" font-size="14" fill="#303030"><tspan x="350" dy="14">Loading sessions... / No sessions across your projects yet. / Could not load sessions. Retry</tspan></text>
<text x="350" y="1278" xml:space="preserve" style="white-space:pre" font-family="monospace" font-size="14" fill="#303030"><tspan x="350" dy="14">Counts and contents are examples; the scrollable list shows four of the 24 sessions.</tspan></text>
<text x="40" y="1360" xml:space="preserve" style="white-space:pre" font-family="monospace" font-size="14" fill="#303030"><tspan x="40" dy="14">Reference: Windows shell at 35f7d87. All and project labels are proposed additions; see all-sessions.md.</tspan></text>
<text x="40" y="1394" xml:space="preserve" style="white-space:pre" font-family="monospace" font-size="14" fill="#303030"><tspan x="40" dy="14">Shared theme.* and layout.* roles apply. Existing conversation controls: conversation.svg.</tspan></text></svg>
